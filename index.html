<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: whitesmoke;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            display: flex;
            gap: 20px;
            padding: 20px;
            background-color: gray;
        }

        .game {
            width: 800px;
            height: 600px;
            background-color: black;
            position: relative;
            overflow: hidden;
        }

        .block-area {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .block {
            width: 50px;
            height: 20px;
            position: absolute;
        }

        .ball {
            width: 16px;
            height: 16px;
            background-color: white;
            position: absolute;
        }

        .bar {
            width: 100px;
            height: 15px;
            background-color: white;
            position: absolute;
        }

        .menu {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu h3 {
            margin: 10px 0 0 0;
            font-size: 16px;
        }

        .menu button {
            padding: 10px;
            cursor: pointer;
            background-color: darkslategray;
            color: white;
            border: 1px solid gray;
            font-weight: bold;
        }

        .menu button:hover {
            background-color: dimgray;
        }

        .menu button:active {
            background-color: dodgerblue;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls button {
            flex: 1;
        }

        .levels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .gift {
            width: 40px;
            height: 25px;
            position: absolute;
            background-color: gold;
            color: black;
            font-weight: bold;
            text-align: center;
            line-height: 25px;
            border: 1px solid orange;
        }
    </style>
</head>
<body>

<div class="main">
    <div class="game">
        <div class="block-area"></div>
        <div class="ball"></div>
        <div class="bar"></div>
    </div>

    <div class="menu">
        <div class="controls">
            <button class="play-btn">Nhấn space để chơi</button>
            <button class="pause-btn">Tạm dừng</button>
        </div>

        <h3>Level</h3>

        <div class="levels">
            <button class="lvl-btn" data-level="1">Lv1</button>
            <button class="lvl-btn" data-level="2">Lv2</button>
            <button class="lvl-btn" data-level="3">Lv3</button>
            <button class="lvl-btn" data-level="4">Lv4</button>
            <button class="lvl-btn" data-level="5">Lv5</button>
            <button class="lvl-btn" data-level="6">Lv6</button>
        </div>
    </div>
</div>

<script src="pingpong.js"></script>

</body>
</html>
